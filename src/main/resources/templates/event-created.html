<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Event Created - SEPS</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<nav class="navbar"><div class="brand">SEPS</div><div class="nav-links"><a href="/coach">Dashboard</a><a href="/coach/create-event">Create Event</a><a href="/logout">Logout</a></div></nav>
<main class="container narrow">
    <section class="card success-screen"><div class="success-icon">✓</div><span class="kicker">Event Created</span><h1>Match event created successfully</h1><p>Your event <strong th:text="${event.eventName}">Event</strong> is ready for player registration.</p>
        <div class="mini-stats"><div><span>Sport</span><strong th:text="${event.sportType}"></strong></div><div><span>Format</span><strong th:text="${event.matchFormat}"></strong></div><div><span>Active</span><strong th:text="${event.selectedActivePlayers}"></strong></div><div><span>Max</span><strong th:text="${event.sportMaxActivePlayers}"></strong></div></div>
        <div class="button-row center"><a class="btn btn-primary" th:href="@{'/coach/event/' + ${event.eventId}}">Manage Event</a><a class="btn btn-light" href="/coach">Dashboard</a></div>
    </section>
</main>
</body>
</html>
