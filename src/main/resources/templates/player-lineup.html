<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Published Lineup - SEPS</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/lineup-graphic.css"><script src="/js/lineup-graphic.js" defer></script></head>
<body>
<nav class="navbar"><div class="brand">SEPS</div><div class="nav-links"><a href="/player">Dashboard</a><a th:href="@{'/player/event/' + ${event.eventId}}">Event</a><a href="/logout">Logout</a></div></nav>
<main class="container">
    <section class="page-header dark-header"><div><span class="kicker light">Published Lineup</span><h1 th:text="${event.eventName}"></h1><p>View final Team A vs Team B match assignment.</p><div class="meta-pills"><span th:text="${event.sportType}"></span><span th:text="${event.matchFormat}"></span><span th:text="${event.status}"></span></div></div></section>
    <section class="card" th:if="${myRegistration != null}"><div class="section-title"><span>Your Assignment</span><h2 th:text="${myRegistration.playerName}"></h2></div><div class="mini-stats"><div><span>Team</span><strong th:text="${myRegistration.teamAssignment}"></strong></div><div><span>Position</span><strong th:text="${myRegistration.assignedPosition}"></strong></div><div><span>Status</span><strong th:text="${myRegistration.selectionStatus}"></strong></div><div><span>Requested</span><strong th:text="${myRegistration.requestedPosition}"></strong></div></div></section>
    <section class="card graphic-card"><div class="section-title"><span>Graphical Match Lineup</span><h2 th:text="${event.teamAName + ' vs ' + event.teamBName}"></h2></div><div class="match-field"><div class="team-side blue-side"><div class="team-heading"><h3 th:text="${event.teamAName}"></h3><span th:text="${event.teamAFormation}"></span></div><div class="player-grid"><div class="player-token" th:each="p : ${teamAPlayers}"><span th:text="${#strings.substring(p.playerName,0,1)}"></span><strong th:text="${p.playerName}"></strong><small th:text="${p.assignedPosition}"></small></div><div class="empty-slot" th:each="s : ${#numbers.sequence(1, event.selectedPlayersPerTeam - teamAPlayers.size())}" th:if="${event.selectedPlayersPerTeam > teamAPlayers.size()}">Open Slot</div></div></div><div class="vs-circle">VS</div><div class="team-side green-side"><div class="team-heading"><h3 th:text="${event.teamBName}"></h3><span th:text="${event.teamBFormation}"></span></div><div class="player-grid"><div class="player-token" th:each="p : ${teamBPlayers}"><span th:text="${#strings.substring(p.playerName,0,1)}"></span><strong th:text="${p.playerName}"></strong><small th:text="${p.assignedPosition}"></small></div><div class="empty-slot" th:each="s : ${#numbers.sequence(1, event.selectedPlayersPerTeam - teamBPlayers.size())}" th:if="${event.selectedPlayersPerTeam > teamBPlayers.size()}">Open Slot</div></div></div></div></section>
    <section class="cards-3"><div class="card"><div class="section-title"><span>Team A</span><h2 th:text="${event.teamAName}"></h2></div><div class="roster-card" th:each="p : ${teamAPlayers}"><strong th:text="${p.playerName}"></strong><span th:text="${p.assignedPosition}"></span></div></div><div class="card"><div class="section-title"><span>Team B</span><h2 th:text="${event.teamBName}"></h2></div><div class="roster-card" th:each="p : ${teamBPlayers}"><strong th:text="${p.playerName}"></strong><span th:text="${p.assignedPosition}"></span></div></div><div class="card"><div class="section-title"><span>Bench</span><h2>Substitutes</h2></div><div class="roster-card sub" th:each="p : ${substitutes}"><strong th:text="${p.playerName}"></strong><span th:text="${p.requestedPosition}"></span></div></div></section>
</main>
</body>
</html>
