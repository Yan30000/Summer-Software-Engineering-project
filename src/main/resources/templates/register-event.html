<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Register for Event - SEPS</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<nav class="navbar"><div class="brand">SEPS</div><div class="nav-links"><a href="/player">Dashboard</a><a th:href="@{'/player/event/' + ${event.eventId}}">Event Details</a><a href="/logout">Logout</a></div></nav>
<main class="container narrow"><section class="card"><span class="kicker">Register</span><h1 th:text="${event.eventName}"></h1><p class="muted">Choose your requested position. The coach will assign Team A, Team B, or Substitute.</p><form action="/player/register" method="post" class="form"><input type="hidden" name="eventId" th:value="${event.eventId}"><label>Requested Position</label><select name="requestedPosition" required><option th:each="position : ${positionOptions}" th:value="${position}" th:text="${position}"></option></select><button class="btn btn-primary">Submit Registration</button></form></section></main>
</body>
</html>
