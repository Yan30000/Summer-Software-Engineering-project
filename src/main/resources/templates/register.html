<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Create Account - SEPS</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<nav class="navbar"><div class="brand">SEPS</div><div class="nav-links"><a href="/">Home</a><a href="/login">Login</a></div></nav>
<main class="auth-page">
    <section class="auth-card">
        <span class="kicker">Join SEPS</span><h1>Create Account</h1><p>Register as a coach or player.</p>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <form action="/register" method="post" class="form">
            <label>Full Name</label><input type="text" name="name" required>
            <label>Email Address</label><input type="email" name="email" required>
            <label>Password</label><input type="password" name="password" required>
            <label>Account Type</label><select name="role" required><option value="PLAYER">Player</option><option value="COACH">Coach</option></select>
            <button class="btn btn-primary" type="submit">Create Account</button>
        </form>
        <p class="muted">Already have an account? <a href="/login">Login</a></p>
    </section>
</main>
</body>
</html>
