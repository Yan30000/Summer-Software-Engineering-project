<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration Closed - SEPS</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="navbar">
    <h2>Registration Closed</h2>
    <div>
        <a href="/">Home</a>
        <a href="/player">Player Dashboard</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>Registration Not Available</h1>

        <div class="error">
            Registration is closed for this event, the deadline has passed,
            or the lineup has already been finalized.
        </div>

        <p>
            <strong>Event:</strong>
            <span th:text="${event.eventName}"></span>
        </p>

        <p>
            <strong>Deadline:</strong>
            <span th:text="${event.registrationDeadLine}"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span th:text="${event.status}"></span>
        </p>

        <a href="/player" class="btn">
            Back to Player Dashboard
        </a>
    </div>
</div>

</body>
</html>
