<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration Successful - SEPS</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="navbar">
    <h2>Registration Complete</h2>
    <div>
        <a href="/">Home</a>
        <a href="/player">Player Dashboard</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h1>Registration Saved Successfully</h1>

        <div class="notice">
            Your registration has been sent to the coach.
            Wait for the coach to finalize and publish the lineup.
        </div>

        <p>
            <strong>Event:</strong>
            <span th:text="${event.eventName}"></span>
        </p>

        <p>
            <strong>Player:</strong>
            <span th:text="${registration.playerName}"></span>
        </p>

        <p>
            <strong>Email:</strong>
            <span th:text="${registration.email}"></span>
        </p>

        <p>
            <strong>Requested Position:</strong>
            <span th:text="${registration.requestedPosition}"></span>
        </p>

        <p>
            <strong>Assigned Position:</strong>
            <span th:text="${registration.assignedPosition}"></span>
        </p>

        <p>
            <strong>Status:</strong>
            <span class="badge badge-wait"
                  th:text="${registration.selectionStatus}">
            </span>
        </p>

        <form th:if="${event.finalized == false}"
              th:action="@{'/player/cancel-registration/' + ${registration.registrationId}}"
              method="post">

            <button type="submit" class="btn btn-danger">
                Cancel Registration
            </button>
        </form>

        <a href="/player" class="btn">
            Back to Events
        </a>

        <a th:href="@{'/player/lineup/' + ${event.eventId}}"
           class="btn btn-secondary">
            Check Lineup
        </a>
    </div>
</div>

</body>
</html>
